<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance List</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1d6b45">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/boot-check.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="home.html">
      <img class="brand-logo" src="img/logo.svg" alt="" width="38" height="38">
      <span><span data-site-name></span><small data-university-name></small></span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    <nav class="nav" aria-label="Main menu">
      <span class="user-name" id="user-name"></span>
      <a href="home.html">My Orgs</a>
      <a href="account.html">Account</a>
      <a href="admin.html" id="admin-link" class="hidden">Admin</a>
      <button id="logout-btn" type="button">Log out</button>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-head">
        <div>
          <a class="back-btn" id="back-link" href="home.html">&larr; Back to org</a>
          <p class="muted small" style="margin:0"><span id="org-name"></span></p>
          <h1 id="event-title" style="margin:0">Loading...</h1>
          <div class="event-meta" id="event-meta"></div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <a class="btn btn-outline" id="scan-link" href="#">Open scanner</a>
          <button class="btn" id="csv-btn">Download CSV (Excel)</button>
        </div>
      </div>
    </section>
    <section class="card">
      <div class="card-head">
        <h2><span id="att-count">0</span> attendees</h2>
        <input id="search" placeholder="Search name, student no. or course" style="max-width:320px">
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Name</th><th>Student No.</th><th>Course &amp; Year</th><th>Time In</th><th></th></tr></thead>
        <tbody id="att-body"><tr><td colspan="6" class="empty">Loading...</td></tr></tbody>
      </table></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-brand"><img src="img/logo.svg" alt="" width="28" height="28"><span data-site-name></span></div>
    <nav class="footer-links" aria-label="Footer">
      <a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy Policy</a>
    </nav>
    <div>&copy; <span id="footer-year"></span> <span data-site-name></span> &middot; <span data-university-name></span></div>
  </footer>
  <script type="module" src="js/attendance.js"></script>
</body>
</html>
