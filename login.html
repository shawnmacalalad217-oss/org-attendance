<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="theme-color" content="#1d6b45">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/boot-check.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="img/logo.svg" alt="" width="38" height="38">
      <span><span data-site-name></span><small data-university-name></small></span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    <nav class="nav" aria-label="Main menu">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a class="guest-only" href="login.html">Log in</a>
      <a class="guest-only nav-cta" href="signup.html">Create account</a>
      <a class="user-only hidden nav-cta" href="home.html">My Orgs</a>
    </nav>
  </header>

  <main class="container narrow">
    <a class="back-btn" href="index.html" data-back>&larr; Back</a>
    <section class="card">
      <h1 id="login-title">Log in</h1>
      <p class="muted" id="login-sub">Members, officers and the admin all log in here.</p>
      <button class="btn btn-google btn-block" type="button" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.8-5.8l-7.4-5.8c-2.1 1.4-4.8 2.2-8.4 2.2-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        <span>Continue with Google</span></button>
      <div class="auth-divider"><span>or</span></div>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">Email</label>
          <input id="email" type="email" autocomplete="username"></div>
        <div class="field"><div class="label-row"><label for="password">Password</label>
          <a href="#" id="forgot-link" class="small">Forgot password?</a></div>
          <input id="password" type="password" autocomplete="current-password"></div>
        <button class="btn btn-block" type="submit" id="login-btn">Log in</button>
      </form>
      <form id="reset-form" class="reset-box hidden" novalidate>
        <h2>Reset your password</h2>
        <p class="small muted">Enter your account email. We will send you a link to set a new password.</p>
        <div class="field"><label for="reset-email">Email</label>
          <input id="reset-email" type="email" autocomplete="username"></div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <button class="btn" type="submit" id="reset-btn">Send reset link</button>
          <button class="btn btn-outline" type="button" id="reset-cancel">Back to login</button>
        </div>
      </form>
      <p class="small muted" style="margin-top:14px">No account yet? <a href="signup.html">Create one</a></p>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-brand"><img src="img/logo.svg" alt="" width="28" height="28"><span data-site-name></span></div>
    <nav class="footer-links" aria-label="Footer">
      <a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy Policy</a>
    </nav>
    <div>&copy; <span id="footer-year"></span> <span data-site-name></span> &middot; <span data-university-name></span></div>
  </footer>
  <script type="module" src="js/login.js"></script>
</body>
</html>
